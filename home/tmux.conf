# === General ===
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -sg escape-time 0
set -g focus-events on

# === Prefix ===
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# === Splits ===
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# === Pane navigation (vim-style) ===
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# === Pane resizing ===
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# === Copy mode (vi) ===
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# === Project launcher ===
# prefix f: fuzzy-pick a project (or Claude worktree) under ~/projects in a popup and switch to its session;
# the first visit creates it as nvim | claude. Replaces the default find-window binding.
bind f display-popup -E -w 70% -h 60% '~/.config/tmux/project.sh'

# === Reload config ===
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# === Pane borders ===
set -g pane-border-style 'fg=#44475a'
set -g pane-active-border-style 'fg=#bd93f9'

# === Status bar ===
set -g status-position bottom
set -g status-style 'bg=#282a36 fg=#f8f8f2'
set -g status-left '#{?client_prefix,#[fg=#282a36]#[bg=#ff5555]#[bold] * ,#[fg=#282a36]#[bg=#bd93f9]#[bold] #S }#[default] '
set -g status-left-length 30
# git-status.sh draws the path [branch] chip (orange when dirty). The command string changes with the
# pane's path, so the chip refreshes right away on a pane switch; weather.sh caches for 15 minutes.
set -g status-interval 5
set -g status-right-length 140
set -g status-right '#(~/.config/tmux/git-status.sh "#{pane_current_path}") #(~/.config/tmux/battery.sh) #[fg=#6272a4]%m/%d/%Y %I:%M %p #[fg=#44475a]#(~/.config/tmux/weather.sh) '
setw -g window-status-format '#[fg=#6272a4] #I:#W '
setw -g window-status-current-format '#[fg=#282a36,bg=#bd93f9,bold] #I:#W '
